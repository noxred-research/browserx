[package]
name = "browserx-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
description = "cargo-fuzz targets for BrowserX parsers; excluded from the main workspace"

[package.metadata]
cargo-fuzz = true

# Own workspace: the root `Cargo.toml` excludes `fuzz/` so the fuzz profile, the libFuzzer
# runtime and `-C instrument-coverage` never leak into the product build.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
browserx-core = { path = "../crates/browserx-core" }
browserx-egress = { path = "../crates/browserx-egress" }
browserx-server = { path = "../crates/browserx-server" }
serde_json = "1"

[lib]
name = "browserx_fuzz"
path = "src/lib.rs"

# Every target is a `#![no_main]` libFuzzer entry under `--cfg fuzzing` (what `cargo fuzz`
# passes) and a plain stdin-driven binary otherwise, so `cargo check --manifest-path
# fuzz/Cargo.toml` works on stable and a crash input can be replayed without nightly.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[[bin]]
name = "session_body"
path = "fuzz_targets/session_body.rs"
test = false
doc = false
bench = false

[[bin]]
name = "id_parse"
path = "fuzz_targets/id_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "egress_request"
path = "fuzz_targets/egress_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proxy_route"
path = "fuzz_targets/proxy_route.rs"
test = false
doc = false
bench = false
