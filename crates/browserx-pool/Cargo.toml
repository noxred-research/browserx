[package]
name = "browserx-pool"
description = "BrowserX scheduler: admission, allocation, leases, recovery, snapshots and handoff"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Exposes `browserx_pool::testing` (an in-process fake browser runtime) to other crates' tests.
testing = ["dep:tokio-tungstenite", "dep:serde_json"]

[dependencies]
browserx-core.workspace = true
browserx-egress.workspace = true
browserx-runtime.workspace = true
browserx-store.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
time.workspace = true
hex.workspace = true
sha2.workspace = true
tokio-tungstenite = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite.workspace = true
serde_json.workspace = true
base64.workspace = true

[lints]
workspace = true
