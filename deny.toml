[graph]
all-features = true

[licenses]
# Permissive licenses only. CDLA-Permissive-2.0 covers Mozilla root store data (webpki-roots).
allow = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "BSL-1.0", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Workspace crates are `publish = false`; AGPL-3.0-only is the project license.
private = { ignore = true }

[advisories]
yanked = "deny"
unmaintained = "workspace"
# Each ignore names why the advisory does not apply and when to revisit it.
# RUSTSEC-2026-0543 (chrono, unmaintained, no vulnerability) is deliberately NOT ignored here.
# BrowserX has no direct `chrono` dependency: `rskafka` 0.6.0 (the Kafka audit sink of
# browserx-mcp) pulls it in, and its public record type is `chrono::DateTime<Utc>`. With
# `unmaintained = "workspace"` the advisory only applies to direct workspace dependencies, so
# `cargo deny` passes, and an ignore entry would only warn `advisory-not-detected`. Scanners that
# read `Cargo.lock` (OpenSSF Scorecard, OSV) still report it. Upstream issue:
# https://github.com/influxdata/rskafka/issues/311.
# REVIEW BY 2026-12-31: bump rskafka once a release drops chrono. If this crate ever gains a
# direct chrono dependency, or the scope above is widened, add the ignore entry here with a
# reason and the same expiry.
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
